name: Publish web app
on:
  push:
    branches: [main]
    paths: ['ghostchat-web/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Scrivi la configurazione
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          cfg = {"url": os.environ.get("SUPABASE_URL", ""), "key": os.environ.get("SUPABASE_KEY", "")}
          open("ghostchat-web/config.js", "w").write("window.GHOST_CONFIG = " + json.dumps(cfg) + ";\n")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ghostchat-web
      - id: deployment
        uses: actions/deploy-pages@v4
